<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>SDI Delivery Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SDI Tracker">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2f2f0;
    --surface: #ffffff;
    --border: #e0e0dc;
    --text: #1a1a1a;
    --text-soft: #6b6b66;
    --text-faint: #a0a09a;
    --green: #1d9e75;
    --green-bg: #e6f5ef;
    --green-dark: #085041;
    --red: #d23b3b;
    --red-bg: #fce8e8;
    --red-dark: #7a1f1f;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { padding: 16px 16px 100px; min-height: 100vh; max-width: 480px; margin: 0 auto; }

  /* Header */
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .brand-icon { width: 38px; height: 38px; border-radius: 10px; background: var(--text); color: var(--bg); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; flex-shrink: 0; }
  .brand h1 { font-size: 18px; font-weight: 600; line-height: 1.2; }
  .brand p { font-size: 12px; color: var(--text-soft); margin-top: 1px; }

  /* Counts */
  .counts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .count-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 8px; text-align: center; transition: all 0.15s; }
  .count-card:active { transform: scale(0.96); }
  .count-card.active { border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }
  .count-val { font-size: 30px; font-weight: 700; line-height: 1; }
  .count-lbl { font-size: 11px; color: var(--text-soft); margin-top: 4px; font-weight: 500; }

  /* Big Buttons */
  .big-btns { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
  .big-btn { border: none; border-radius: 14px; padding: 22px 20px; font-size: 18px; font-weight: 600; font-family: inherit; cursor: pointer; color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; transition: transform 0.1s; }
  .big-btn:active { transform: scale(0.97); }
  .big-btn-out { background: var(--green); }
  .big-btn-back { background: var(--red); }
  .big-btn svg { flex-shrink: 0; }

  /* Form */
  .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 20px; }
  .form-title { font-size: 16px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .form-title .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .field { margin-bottom: 12px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--text-soft); display: block; margin-bottom: 5px; }
  .field input { width: 100%; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; font-size: 16px; font-family: inherit; background: var(--bg); color: var(--text); }
  .field input:focus { outline: none; border-color: var(--text); background: var(--surface); }
  .field-error { font-size: 12px; color: var(--red); margin-top: 4px; display: none; }

  /* Driver pills */
  .driver-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .driver-pill { font-size: 13px; padding: 7px 16px; border-radius: 99px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; font-family: inherit; font-weight: 500; transition: all 0.1s; }
  .driver-pill:active { transform: scale(0.96); }
  .driver-pill.active { background: var(--text); color: #fff; border-color: var(--text); }

  /* Photo */
  .photo-area { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; background: var(--bg); position: relative; }
  .photo-preview { width: 100%; max-height: 250px; object-fit: cover; display: block; }
  .photo-retake { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.65); color: #fff; border: none; border-radius: 99px; padding: 6px 14px; font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer; }
  .photo-placeholder { padding: 28px 16px; text-align: center; cursor: pointer; }
  .photo-placeholder svg { color: var(--text-faint); margin-bottom: 6px; }
  .photo-placeholder p { font-size: 13px; color: var(--text-soft); }

  .form-btns { display: flex; gap: 8px; margin-top: 14px; }
  .form-btns button { flex: 1; border-radius: var(--radius); padding: 13px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; border: none; }
  .form-btns button:active { transform: scale(0.97); }
  .btn-save-out { background: var(--green); color: #fff; }
  .btn-save-back { background: var(--red); color: #fff; }
  .btn-cancel { background: var(--bg); color: var(--text); border: 1px solid var(--border) !important; }

  .cam-input { display: none; }

  /* Loading */
  .form-loading { text-align: center; padding: 8px 0 4px; font-size: 13px; color: var(--text-soft); display: none; }

  /* List */
  .list-header { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); margin-bottom: 10px; }
  .order-list { display: flex; flex-direction: column; gap: 8px; }
  .order-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
  .order-card.out { border-left: 4px solid var(--green); }
  .order-card.returned { border-left: 4px solid var(--red); }
  .order-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .order-name { font-size: 16px; font-weight: 600; }
  .order-meta { font-size: 12px; color: var(--text-soft); margin-top: 2px; }
  .order-badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 99px; white-space: nowrap; flex-shrink: 0; }
  .badge-out { background: var(--green-bg); color: var(--green-dark); }
  .badge-back { background: var(--red-bg); color: var(--red-dark); }
  .order-thumb { width: 100%; border-radius: 6px; margin-top: 8px; display: block; max-height: 200px; object-fit: cover; }
  .empty { text-align: center; color: var(--text-faint); font-size: 14px; padding: 40px 16px; }
  .empty svg { margin-bottom: 8px; }

  /* Select for returns */
  .field select { width: 100%; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; font-size: 16px; font-family: inherit; background: var(--bg); color: var(--text); -webkit-appearance: auto; appearance: auto; }
  .or-divider { text-align: center; font-size: 12px; color: var(--text-faint); margin: 6px 0; }

  /* Toast */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(10px); background: var(--text); color: var(--bg); padding: 10px 20px; border-radius: 99px; font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none; transition: all 0.2s; z-index: 50; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="brand">
  <div class="brand-icon">S</div>
  <div>
    <h1>SDI Delivery Tracker</h1>
    <p id="date-display"></p>
  </div>
</div>

<div class="counts">
  <div class="count-card" onclick="setFilter('all')" style="cursor:pointer"><div class="count-val" id="c-out" style="color:var(--green)">0</div><div class="count-lbl">Went out</div></div>
  <div class="count-card" onclick="setFilter('returned')" style="cursor:pointer"><div class="count-val" id="c-back" style="color:var(--red)">0</div><div class="count-lbl">Not delivered</div></div>
  <div class="count-card" onclick="setFilter('out')" style="cursor:pointer"><div class="count-val" id="c-delivered">0</div><div class="count-lbl">Delivered</div></div>
</div>

<div id="form-area"></div>

<div class="big-btns" id="main-btns">
  <button class="big-btn big-btn-out" onclick="startOrder('out')">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
    Going out
  </button>
  <button class="big-btn big-btn-back" onclick="startOrder('back')">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
    Not delivered
  </button>
</div>

<input type="file" accept="image/*" capture="environment" id="cam-input" class="cam-input">

<div class="list-header" id="list-title">Today's orders</div>
<div class="order-list" id="order-list">
  <div class="empty">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
    <p>No orders yet today</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzo_QLLS5VE6Cw2e6YxSdrkZmDELJM2G1HgWkXHWJeLuYU5qSpryYh_6usuu_52kRq0pQ/exec';

let orders = [];
let currentType = '';
let currentPhoto = null;
let currentFilter = 'all';
const savedDrivers = [];

// Date helpers
function fmtDate(offset) {
  const d = new Date(); d.setDate(d.getDate() + offset);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
const today = fmtDate(0);
document.getElementById('date-display').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

// Toast
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }

function setFilter(filter) {
  currentFilter = filter;
  document.querySelectorAll('.count-card').forEach((card, i) => {
    const filters = ['all', 'returned', 'out'];
    card.classList.toggle('active', filters[i] === filter);
  });
  render();
}

// Camera
const camInput = document.getElementById('cam-input');

function startOrder(type) {
  currentType = type;
  currentPhoto = null;
  camInput.value = '';
  camInput.click();
}

camInput.addEventListener('change', function() {
  if (!this.files || !this.files[0]) return;
  const file = this.files[0];
  // Compress image before storing
  const reader = new FileReader();
  reader.onload = function(e) {
    compressImage(e.target.result, 800, 0.7, function(compressed) {
      currentPhoto = compressed;
      showForm(currentType);
    });
  };
  reader.readAsDataURL(file);
});

function compressImage(dataUrl, maxWidth, quality, callback) {
  const img = new Image();
  img.onload = function() {
    const canvas = document.createElement('canvas');
    let w = img.width, h = img.height;
    if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    callback(canvas.toDataURL('image/jpeg', quality));
  };
  img.src = dataUrl;
}

// Form
function showForm(type) {
  const isBack = type === 'back';
  const outOrders = orders.filter(o => o.Status === 'out');

  let selectHtml = '';
  if (isBack && outOrders.length > 0) {
    const opts = outOrders.map(o => `<option value="${esc(o.ID)}" data-name="${esc(o.Name)}" data-driver="${esc(o.Driver || '')}">${esc(o.Name)}${o.Driver ? ' — ' + esc(o.Driver) : ''}</option>`).join('');
    selectHtml = `<div class="field"><label>Select from today's orders</label><select id="f-select"><option value="">-- pick an order --</option>${opts}</select></div><div class="or-divider">or type below</div>`;
  }

  const photoHtml = currentPhoto
    ? `<div class="photo-area"><img src="${currentPhoto}" class="photo-preview"><button class="photo-retake" onclick="retakePhoto()">📷 Retake</button></div>`
    : `<div class="photo-area"><div class="photo-placeholder" onclick="retakePhoto()"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg><p>Tap to take photo</p></div></div>`;

  const allDrivers = [...new Set([...savedDrivers, ...orders.map(o => o.Driver).filter(Boolean)])];
  const pills = allDrivers.length > 0
    ? `<div class="driver-pills">${allDrivers.map(d => `<button class="driver-pill" onclick="pickDriver(this,'${esc(d)}')">${esc(d)}</button>`).join('')}</div>`
    : '';

  document.getElementById('form-area').innerHTML = `<div class="form-card">
    <div class="form-title"><div class="dot" style="background:${isBack ? 'var(--red)' : 'var(--green)'}"></div>${isBack ? 'Not delivered' : 'Going out'}</div>
    ${photoHtml}
    ${selectHtml}
    <div class="field"><label>Order name</label><input type="text" id="f-name" placeholder="e.g. Ahmed Store #1042" autocomplete="off"><div class="field-error" id="err-name">Enter the order name</div></div>
    <div class="field"><label>Delivery person</label>${pills}<input type="text" id="f-driver" placeholder="e.g. John" autocomplete="off"><div class="field-error" id="err-driver">Enter the delivery person</div></div>
    <div class="form-loading" id="form-loading">Saving...</div>
    <div class="form-btns" id="form-btns">
      <button class="${isBack ? 'btn-save-back' : 'btn-save-out'}" onclick="submitOrder('${type}')">${isBack ? 'Mark not delivered' : 'Mark going out'}</button>
      <button class="btn-cancel" onclick="hideForm()">Cancel</button>
    </div>
  </div>`;

  document.getElementById('main-btns').style.display = 'none';

  if (isBack && outOrders.length > 0) {
    document.getElementById('f-select').addEventListener('change', function() {
      const opt = this.options[this.selectedIndex];
      if (opt.value) {
        document.getElementById('f-name').value = opt.dataset.name || '';
        document.getElementById('f-driver').value = opt.dataset.driver || '';
        document.querySelectorAll('.driver-pill').forEach(p => p.classList.toggle('active', p.textContent === (opt.dataset.driver || '')));
      }
    });
  }
  setTimeout(() => document.getElementById('f-name').focus(), 100);
}

function pickDriver(btn, name) {
  document.querySelectorAll('.driver-pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('f-driver').value = name;
}

function retakePhoto() { camInput.value = ''; camInput.click(); }

function hideForm() {
  document.getElementById('form-area').innerHTML = '';
  document.getElementById('main-btns').style.display = 'flex';
  currentPhoto = null;
}

async function submitOrder(type) {
  const nameInput = document.getElementById('f-name');
  const driverInput = document.getElementById('f-driver');
  const name = nameInput.value.trim();
  const driver = driverInput.value.trim();

  let hasErr = false;
  if (!name) { document.getElementById('err-name').style.display = 'block'; nameInput.addEventListener('input', () => document.getElementById('err-name').style.display = 'none', { once: true }); hasErr = true; }
  if (!driver) { document.getElementById('err-driver').style.display = 'block'; driverInput.addEventListener('input', () => document.getElementById('err-driver').style.display = 'none', { once: true }); hasErr = true; }
  if (hasErr) return;

  if (!savedDrivers.includes(driver)) savedDrivers.push(driver);

  // Show loading
  document.getElementById('form-btns').style.display = 'none';
  document.getElementById('form-loading').style.display = 'block';

  try {
    if (type === 'out') {
      await apiPost({ action: 'addOut', name, driver, photo: currentPhoto || '' });
    } else {
      // Check if picking from existing order
      const sel = document.getElementById('f-select');
      const existingId = sel ? sel.value : '';
      await apiPost({ action: 'addBack', id: existingId || '', name, driver, photo: currentPhoto || '' });
    }
    hideForm();
    showToast(type === 'out' ? 'Order going out ✓' : 'Not delivered ✓');
    await loadOrders();
  } catch (err) {
    showToast('Saved! Refreshing...');
    hideForm();
    setTimeout(() => loadOrders(), 3000);
  }
}

// API
async function apiPost(body) {
  const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) });
  try { return await res.json(); } catch(e) { return {}; }
}

async function loadOrders() {
  try {
    const res = await fetch(API_URL + '?action=list&date=' + today);
    const data = await res.json();
    orders = data.orders || [];
    render();
  } catch (err) {
    // Silently retry later
  }
}

// Render
function render() {
  const outCount = orders.filter(o => o.Status === 'out').length;
  const backCount = orders.filter(o => o.Status === 'returned').length;
  document.getElementById('c-out').textContent = outCount + backCount;
  document.getElementById('c-back').textContent = backCount;
  document.getElementById('c-delivered').textContent = outCount;

  // Update list header
  const titles = { all: "All orders today", out: "Delivered orders", returned: "Not delivered orders" };
  document.getElementById('list-title').textContent = titles[currentFilter] || titles.all;

  // Apply filter
  let filtered = orders;
  if (currentFilter === 'out') filtered = orders.filter(o => o.Status === 'out');
  else if (currentFilter === 'returned') filtered = orders.filter(o => o.Status === 'returned');

  const list = document.getElementById('order-list');
  if (filtered.length === 0) {
    const emptyMsg = orders.length === 0 ? 'No orders yet today' : 'No orders in this category';
    list.innerHTML = `<div class="empty"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg><p>${emptyMsg}</p></div>`;
    return;
  }

  list.innerHTML = filtered.slice().reverse().map(o => {
    const isOut = o.Status === 'out';
    const badge = isOut ? '<span class="order-badge badge-out">Out for delivery</span>' : '<span class="order-badge badge-back">Not delivered</span>';
    const time = isOut ? 'Out ' + (o.TimeOut || '') : 'Returned ' + (o.TimeBack || '');
    const driverText = o.Driver ? ' · ' + esc(o.Driver) : '';
    const photoUrl = isOut ? (o.PhotoOutUrl || '') : (o.PhotoBackUrl || o.PhotoOutUrl || '');
    const thumbHtml = photoUrl ? `<img src="${photoUrl}" class="order-thumb" onerror="this.style.display='none'">` : '';

    return `<div class="order-card ${o.Status}">
      <div class="order-top">
        <div>
          <div class="order-name">${esc(o.Name)}</div>
          <div class="order-meta">${time}${driverText}</div>
        </div>
        ${badge}
      </div>
      ${thumbHtml}
    </div>`;
  }).join('');
}

function esc(str) { if (str == null) return ''; return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

// Init
loadOrders();
setInterval(loadOrders, 30000);
</script>

</body>
</html>
